[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-reporting"
version = "0.1.0"
description = "Profile-driven LLM structured report extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
structured-report = "structured_reporting.cli:main"

[tool.setuptools.packages.find]
include = ["structured_reporting*"]
